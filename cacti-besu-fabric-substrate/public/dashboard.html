<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Asset Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 32px;
    }

    nav a {
      color: #1f2933;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: #52606d;
    }

    .primary-link {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 6px;
      background: #1f2933;
      color: white;
      text-decoration: none;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .toolbar input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      font: inherit;
    }

    .toolbar button {
      padding: 11px 16px;
      border: 1px solid #9aa5b1;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font: inherit;
    }

    #status {
      margin-bottom: 24px;
      padding: 14px;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
      background: white;
    }

    .hidden {
      display: none;
    }

    .error {
      border-color: #c53030 !important;
    }

    .asset-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(290px, 1fr)
        );
      gap: 20px;
    }

    .asset-card {
      display: flex;
      flex-direction: column;
      min-height: 320px;
      padding: 20px;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      background: white;
      box-shadow: 0 2px 8px
        rgba(0, 0, 0, 0.06);
    }

    .asset-card h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .asset-id {
      margin-bottom: 18px;
      color: #616e7c;
      font-size: 0.95rem;
    }

    .asset-details {
      flex: 1;
    }

    .detail-row {
      margin-bottom: 13px;
    }

    .detail-label {
      display: block;
      margin-bottom: 3px;
      color: #52606d;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .detail-value {
      overflow-wrap: anywhere;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .status-active {
      background: #d9f2e6;
      color: #176b46;
    }

    .status-transfer {
      background: #fff3c4;
      color: #8a5a00;
    }

    .status-other {
      background: #e4e7eb;
      color: #3e4c59;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid #e4e7eb;
    }

    .card-actions a {
      padding: 9px 12px;
      border: 1px solid #9aa5b1;
      border-radius: 5px;
      color: #1f2933;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .card-actions a:first-child {
      border-color: #1f2933;
      background: #1f2933;
      color: white;
    }

    .empty-state {
      padding: 28px;
      border: 1px dashed #9aa5b1;
      border-radius: 8px;
      background: white;
      text-align: center;
      color: #52606d;
    }

    @media (max-width: 650px) {
      .header {
        flex-direction: column;
      }

      .toolbar {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <nav>
      <a href="/">Home</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/create-asset.html">Create Asset</a>
      <a href="/transfer-asset.html">Transfer Asset</a>
      <a href="/monitor.html">Monitor Transfer</a>
      <a href="/view-dpp.html">View DPP</a>
    </nav>

    <div class="header">
      <div>
        <h1>Asset Dashboard</h1>

        <p>
          Browse the Digital Product Passports
          currently stored by the application.
        </p>
      </div>

      <a
        class="primary-link"
        href="/create-asset.html"
      >
        Create new asset
      </a>
    </div>

    <div class="toolbar">
      <input
        id="search-input"
        type="search"
        placeholder="Search by asset ID, product, manufacturer or owner"
      >

      <button
        id="refresh-button"
        type="button"
      >
        Refresh
      </button>
    </div>

    <section
      id="status"
      aria-live="polite"
    >
      Loading assets...
    </section>

    <section
      id="asset-grid"
      class="asset-grid"
    ></section>
  </main>

  <script>
    "use strict";

    const searchInput =
      document.getElementById(
        "search-input",
      );

    const refreshButton =
      document.getElementById(
        "refresh-button",
      );

    const statusSection =
      document.getElementById(
        "status",
      );

    const assetGrid =
      document.getElementById(
        "asset-grid",
      );

    let loadedAssets = [];

    function showStatus(
      message,
      type = "",
    ) {
      statusSection.textContent =
        message;

      statusSection.className = "";

      if (type) {
        statusSection.classList.add(
          type,
        );
      }
    }

    function hideStatus() {
      statusSection.className =
        "hidden";
    }

    function getStatusClass(
      status,
    ) {
      if (status === "ACTIVE") {
        return "status-active";
      }

      if (status === "IN_TRANSFER") {
        return "status-transfer";
      }

      return "status-other";
    }

    function addDetail(
      container,
      label,
      value,
    ) {
      const row =
        document.createElement("div");

      row.className =
        "detail-row";

      const labelElement =
        document.createElement("span");

      labelElement.className =
        "detail-label";

      labelElement.textContent =
        label;

      const valueElement =
        document.createElement("div");

      valueElement.className =
        "detail-value";

      valueElement.textContent =
        value || "Not available";

      row.appendChild(
        labelElement,
      );

      row.appendChild(
        valueElement,
      );

      container.appendChild(
        row,
      );
    }

    function createAssetCard(
      asset,
    ) {
      const card =
        document.createElement(
          "article",
        );

      card.className =
        "asset-card";

      const title =
        document.createElement(
          "h2",
        );

      title.textContent =
        asset.productName ||
        "Unnamed product";

      const assetId =
        document.createElement(
          "div",
        );

      assetId.className =
        "asset-id";

      assetId.textContent =
        `Asset ID: ${asset.assetId}`;

      const details =
        document.createElement(
          "div",
        );

      details.className =
        "asset-details";

      addDetail(
        details,
        "Manufacturer",
        asset.manufacturer,
      );

      addDetail(
        details,
        "Current owner",
        asset.owner,
      );

      addDetail(
        details,
        "Current chain",
        asset.chain,
      );

      addDetail(
        details,
        "Production date",
        asset.productionDate,
      );

      const statusRow =
        document.createElement(
          "div",
        );

      statusRow.className =
        "detail-row";

      const statusLabel =
        document.createElement(
          "span",
        );

      statusLabel.className =
        "detail-label";

      statusLabel.textContent =
        "Status";

      const badge =
        document.createElement(
          "span",
        );

      badge.className =
        `status-badge ${
          getStatusClass(
            asset.status,
          )
        }`;

      badge.textContent =
        asset.status ||
        "UNKNOWN";

      statusRow.appendChild(
        statusLabel,
      );

      statusRow.appendChild(
        badge,
      );

      details.appendChild(
        statusRow,
      );

      const actions =
        document.createElement(
          "div",
        );

      actions.className =
        "card-actions";

      const viewLink =
        document.createElement("a");

      viewLink.href =
        `/view-dpp.html?assetId=${
          encodeURIComponent(
            asset.assetId,
          )
        }`;

      viewLink.textContent =
        "View DPP";

      const transferLink =
        document.createElement("a");

      transferLink.href =
        `/transfer-asset.html?assetId=${
          encodeURIComponent(
            asset.assetId,
          )
        }`;

      transferLink.textContent =
        "Transfer";

      actions.appendChild(
        viewLink,
      );

      actions.appendChild(
        transferLink,
      );

      card.appendChild(title);
      card.appendChild(assetId);
      card.appendChild(details);
      card.appendChild(actions);

      return card;
    }

    function renderAssets(
      assets,
    ) {
      assetGrid.innerHTML = "";

      if (assets.length === 0) {
        const empty =
          document.createElement(
            "div",
          );

        empty.className =
          "empty-state";

        empty.textContent =
          "No assets match the current search.";

        assetGrid.appendChild(
          empty,
        );

        return;
      }

      for (const asset of assets) {
        assetGrid.appendChild(
          createAssetCard(asset),
        );
      }
    }

    function filterAssets() {
      const searchText =
        searchInput
          .value
          .trim()
          .toLowerCase();

      if (!searchText) {
        renderAssets(
          loadedAssets,
        );

        return;
      }

      const filteredAssets =
        loadedAssets.filter(
          (asset) => {
            const searchableValues = [
              asset.assetId,
              asset.productName,
              asset.manufacturer,
              asset.owner,
              asset.chain,
              asset.status,
            ];

            return searchableValues.some(
              (value) =>
                String(value ?? "")
                  .toLowerCase()
                  .includes(
                    searchText,
                  ),
            );
          },
        );

      renderAssets(
        filteredAssets,
      );
    }

    async function loadAssets() {
      refreshButton.disabled =
        true;

      showStatus(
        "Loading Digital Product Passports...",
      );

      try {
        const response =
          await fetch(
            "/api/assets",
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          result.success !== true
        ) {
          throw new Error(
            result.error ||
            "Asset loading failed.",
          );
        }

        loadedAssets =
          Array.isArray(
            result.assets,
          )
            ? result.assets
            : [];

        filterAssets();

        if (
          loadedAssets.length === 0
        ) {
          showStatus(
            "No Digital Product Passports are currently stored.",
          );
        } else {
          hideStatus();
        }
      } catch (error) {
        loadedAssets = [];

        assetGrid.innerHTML = "";

        showStatus(
          `Asset loading failed.\n\n${
            error.message
          }`,
          "error",
        );
      } finally {
        refreshButton.disabled =
          false;
      }
    }

    searchInput.addEventListener(
      "input",
      filterAssets,
    );

    refreshButton.addEventListener(
      "click",
      loadAssets,
    );

    loadAssets();
  </script>
</body>
</html>
